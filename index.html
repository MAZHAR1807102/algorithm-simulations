<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Simulations</title>
<meta name="description" content="Interactive step-by-step simulations of algorithms by Mazharul Islam.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@700&display=swap">
<style>
:root{--bg:#eef2f5;--surface:#fff;--ink:#16202a;--muted:#5a6876;--line:#d3dbe3;--accent:#0a6f8c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1318;--surface:#17202a;--ink:#e4ebf2;--muted:#93a2b1;--line:#2b3845;--accent:#4cb8d8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding:0 16px}
main{max-width:820px;margin:0 auto;padding-block:48px}
.eyebrow{font:700 .75rem/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h1{font:800 clamp(2rem,5vw,2.8rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
p.lede{color:var(--muted);margin:10px 0 28px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.sim{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;text-decoration:none}
a.sim:hover,a.sim:focus-visible{border-color:var(--accent)}
a.sim b{display:block;font-size:1.1rem}
a.sim span{color:var(--muted);font-size:.93rem}
footer{color:var(--muted);font-size:.88rem;margin-top:40px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Algorithms</p>
  <h1>Algorithm Simulations</h1>
  <p class="lede">Step through each algorithm one operation at a time, with the pseudocode, the arrays and a trace table side by side.</p>
  <ul>
    <li><a class="sim" href="counting-sort/"><b>Counting Sort</b><span>Count, prefix sums, stable right-to-left placement. Θ(n + k).</span></a></li>
  </ul>
  <footer>Made by Mazharul Islam</footer>
</main>
</body>
</html>
